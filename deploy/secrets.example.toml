# Copy to deploy/runtime/secrets.toml. Do not put real values in this template.
DEEPSEEK_API_KEY = ""

[auth]
redirect_uri = "https://YOUR-DOMAIN/oauth2callback"
cookie_secret = "REPLACE-WITH-A-RANDOM-SECRET-AT-LEAST-32-CHARACTERS"
client_id = "REPLACE-CLIENT-ID"
client_secret = "REPLACE-CLIENT-SECRET"
server_metadata_url = "https://YOUR-OIDC-PROVIDER/.well-known/openid-configuration"

[access]
# Must exactly match the verified token's iss and sub, not a display name/email.
issuer = "https://YOUR-OIDC-PROVIDER/"
allowed_subjects = ["REPLACE-WITH-APPROVED-ACCOUNT-SUB"]
