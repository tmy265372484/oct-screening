[server]
address = "127.0.0.1"
maxUploadSize = 10
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#218b91"
backgroundColor = "#e9edf3"
secondaryBackgroundColor = "#e9edf3"
textColor = "#263548"
borderColor = "#d5dbe4"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "12px"
font = "sans-serif"
baseFontSize = 14
headingFontSizes = ["28px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#218b91", "#e39a55", "#8b78c9", "#5f987e"]
dataframeHeaderBackgroundColor = "#e4e9f0"

[theme.sidebar]
backgroundColor = "#e9edf3"
secondaryBackgroundColor = "#e4e9f0"
textColor = "#34465a"
primaryColor = "#218b91"
borderColor = "#d5dbe4"
