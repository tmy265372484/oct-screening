[server]
address = "127.0.0.1"
maxUploadSize = 10
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#add5ce"
backgroundColor = "#17232b"
secondaryBackgroundColor = "#17232b"
textColor = "#eef3f5"
borderColor = "#52616a"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "12px"
font = "sans-serif"
baseFontSize = 14
headingFontSizes = ["28px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#add5ce", "#e39a55", "#8b78c9", "#5f987e"]
dataframeHeaderBackgroundColor = "#22343f"

[theme.sidebar]
backgroundColor = "#17232b"
secondaryBackgroundColor = "#22343f"
textColor = "#eef3f5"
primaryColor = "#add5ce"
borderColor = "#52616a"
